# Keep daemon/cache settings aligned with the OSS root; this single gradletestapps
# build now hosts both fixtures at once, so the default Gradle metaspace limit is
# too small for the combined Kotlin/KSP workload.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -XX:+EnableDynamicAgentLoading
org.gradle.caching=true
