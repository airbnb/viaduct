syntax = "proto3";

package viaduct.remote.grpc;

option java_package = "viaduct.remote.grpc";
option java_multiple_files = true;
option java_outer_classname = "RemoteResolverProto";

// Service for executing resolvers remotely (RRP -> RRS)
service RemoteResolverService {
  // Execute a batch of node resolver invocations
  rpc BatchResolveNode(BatchResolveNodeRequest) returns (BatchResolveNodeResponse);

  // Execute a batch of field resolver invocations
  rpc BatchResolveField(BatchResolveFieldRequest) returns (BatchResolveFieldResponse);
}

// Service for callbacks from resolver back to engine (RRS -> RRP)
service EngineCallbackService {
  // Execute a GraphQL query
  rpc ExecuteQuery(QueryRequest) returns (QueryResponse);

  // Execute a GraphQL mutation
  rpc ExecuteMutation(QueryRequest) returns (QueryResponse);
}

// Request to resolve a batch of nodes
message BatchResolveNodeRequest {
  // Identifier for the NodeResolverExecutor to invoke
  string executor_id = 1;

  // List of node selectors to resolve
  repeated Selector selectors = 2;

  // Opaque handle to an EngineExecutionContext held by the sender; valid only for
  // the duration of the request.
  string context_handle = 3;

  // Endpoint the remote service dials for re-entrant callbacks, in "host:port" form.
  string callback_endpoint = 4;

  // Opaque host-defined context captured for this node resolver batch.
  EncodedRemoteContext remote_context = 5;
}

// A single node to be resolved
message Selector {
  // Node ID
  string id = 1;

  // Opaque handle to an EngineSelectionSet held by the sender.
  string selections_handle = 2;
}

// Response containing resolved nodes
message BatchResolveNodeResponse {
  // Results for each selector
  repeated ResolvedNode results = 1;
}

// Result for a single node resolution
message ResolvedNode {
  // The selector ID this result corresponds to
  string selector_id = 1;

  // The resolution result (either success or error)
  oneof result {
    // Success: the node's EngineObjectData, JSON-encoded by EngineObjectDataSerializer
    // (a versioned `[version, value]` root; see that class for the value encoding).
    bytes data_json = 2;

    // Failure: error information
    ErrorInfo error = 3;
  }
}

// Request to resolve a batch of field-resolver invocations
message BatchResolveFieldRequest {
  // Identifier for the FieldResolverExecutor to invoke (the field coordinate, "Type.field")
  string executor_id = 1;

  // List of field selectors to resolve
  repeated FieldSelector selectors = 2;

  // Opaque handle to an EngineExecutionContext held by the sender; valid only for
  // the duration of the request.
  string context_handle = 3;

  // Endpoint the remote service dials for re-entrant callbacks, in "host:port" form.
  string callback_endpoint = 4;

  // Opaque host-defined context captured for this field resolver batch.
  EncodedRemoteContext remote_context = 5;
}

// A transport-neutral context envelope. The remote-resolver framework does not interpret payload.
message EncodedRemoteContext {
  // Host-defined payload format identifier.
  string format = 1;

  // Host-defined payload format version.
  uint32 version = 2;

  // Encoded host context.
  bytes payload = 3;
}

// A serialized EngineSelectionSet — carries a field's sub-selections over the wire so the remote
// can reconstruct them against its own schema when the per-JVM selections_handle is unresolvable.
message SerializedSelectionSet {
  // Type condition the selections are on (EngineSelectionSet.type).
  string type = 1;

  // Fragment document string (EngineSelectionSet.toFragment().document), e.g.
  // "fragment Main on Species { name }". Blank means an empty selection set.
  string document = 2;

  // Selection-set variables as a JSON object (Map<String, Any?>); same codec as arguments_json.
  bytes variables_json = 3;
}

// A single field invocation to resolve
message FieldSelector {
  // Sender-assigned key (batch index) used to correlate the response; FieldResolverExecutor
  // selectors have no natural id of their own.
  string selector_key = 1;

  // Field arguments serialized as a JSON object (Map<String, Any?>).
  bytes arguments_json = 2;

  // Opaque handle to the EngineSelectionSet on the field (sub-selections), or empty when
  // the field has no selections or the receiver cannot resolve the sender's registry handle.
  // Preferred when resolvable because it preserves object identity; otherwise use `selections`.
  string selections_handle = 3;

  // Eagerly-resolved required-selection-set object value (the parent object), as an
  // EngineObjectDataSerializer payload — an empty object when the resolver declares no object
  // selection set.
  bytes object_value_json = 4;

  // Eagerly-resolved required-selection-set query value, as an EngineObjectDataSerializer payload —
  // an empty object when the resolver declares no query selection set.
  bytes query_value_json = 5;

  // Serialized sub-selection set, populated whenever the selector has a non-empty selection set.
  // The remote reconstructs it against its own schema when selections_handle isn't resolvable.
  SerializedSelectionSet selections = 6;
}

// Response containing resolved field values
message BatchResolveFieldResponse {
  // Results for each selector
  repeated ResolvedField results = 1;
}

// Result for a single field resolution
message ResolvedField {
  // The selector_key this result corresponds to
  string selector_key = 1;

  oneof result {
    // Success: the field value, JSON-encoded by EngineObjectDataSerializer — each object records its
    // concrete GraphQL type, and the root is a versioned `[version, value]` array.
    // NOTE: successive encodings here have deliberately reused this field number rather than adding a
    // new one, so the RRS and RRP must be built from the same commit / co-deployed. The root version
    // exists so that violating that fails loudly rather than decoding into a wrong value.
    bytes value_json = 2;

    // Failure: error information
    ErrorInfo error = 3;
  }
}

// Error information for failed resolutions
message ErrorInfo {
  // Error message
  string message = 1;

  // Error type (fully qualified class name)
  string error_type = 2;
}

// Request to execute a query or mutation
message QueryRequest {
  // Handle to the EngineExecutionContext
  string context_handle = 1;

  // Handle to RawSelectionSet for the query
  string selections_handle = 2;

  // Resolver ID for instrumentation
  string resolver_id = 3;
}

// Response from query/mutation execution
message QueryResponse {
  // The selection set's result, as an EngineObjectDataSerializer payload.
  bytes object_data_json = 1;
}

// --- Bidirectional-streaming transport (additive) ---
//
// The main server (RRP) opens one bidirectional stream per resolver batch on a process-wide
// channel. Re-entrant ctx.query()/ctx.mutation() callbacks travel as CallbackRequest/
// CallbackResponse messages on that same stream, instead of through EngineCallbackService.
// There is no callback server on the main-server side, and no context_handle/callback_endpoint
// to resolve across processes: the callback's selection set travels as content
// (SerializedSelectionSet), and the main server answers each callback against the real, local
// EngineExecutionContext bound to the stream it opened.
//
// This service is added alongside RemoteResolverService/EngineCallbackService above, which are
// untouched. Node and field resolvers get separate streaming RPCs, mirroring the existing
// unary split. This split is provisional and may be unified into a single stream type later.
service RemoteResolverStreamService {
  // Execute a batch of node resolver invocations, with re-entrant callbacks multiplexed onto
  // the same stream.
  rpc ResolveNodeBatch(stream ViaductServiceMessage) returns (stream RemoteResolverServiceMessage);

  // Execute a batch of field resolver invocations, with re-entrant callbacks multiplexed onto
  // the same stream.
  rpc ResolveFieldBatch(stream ViaductServiceFieldMessage) returns (stream RemoteResolverServiceFieldMessage);
}

// RRP -> RRS, on the node-resolve stream. The first message on the stream is always
// resolve_request; any number of callback_response messages may follow, one per
// callback_request received from RRS.
message ViaductServiceMessage {
  oneof payload {
    BatchResolveNodeRequest resolve_request = 1;
    CallbackResponse callback_response = 2;
  }
}

// RRS -> RRP, on the node-resolve stream. Any number of callback_request messages may be sent
// (including zero, and including several concurrently in flight for different selectors in
// the batch); resolve_response is always the last message, after which the stream completes.
message RemoteResolverServiceMessage {
  oneof payload {
    CallbackRequest callback_request = 1;
    BatchResolveNodeResponse resolve_response = 2;
  }
}

// RRP -> RRS, on the field-resolve stream. Same lifecycle as ViaductServiceMessage.
message ViaductServiceFieldMessage {
  oneof payload {
    BatchResolveFieldRequest resolve_request = 1;
    CallbackResponse callback_response = 2;
  }
}

// RRS -> RRP, on the field-resolve stream. Same lifecycle as RemoteResolverServiceMessage.
message RemoteResolverServiceFieldMessage {
  oneof payload {
    CallbackRequest callback_request = 1;
    BatchResolveFieldResponse resolve_response = 2;
  }
}

// A re-entrant ctx.query()/ctx.mutation() call, sent by RRS on the stream it received the
// original resolve_request on. Carries the selection set's content, not a handle -- the
// receiving side (RRP) has no way to resolve a reference into RRS's process-local registry, so
// the actual selections travel on the wire.
message CallbackRequest {
  // Correlates this request with its CallbackResponse; scoped to one stream. A batch may have
  // several of these in flight concurrently (independent selectors calling ctx.query() at
  // overlapping times), so this must be unique per outstanding call within the stream, not
  // globally.
  string correlation_id = 1;

  // The query/mutation's selection set, in the same wire form field selectors already use for
  // their own sub-selections.
  SerializedSelectionSet selections = 2;

  // Resolver ID, for instrumentation on the RRP side (mirrors QueryRequest.resolver_id above).
  string resolver_id = 3;

  // True for ctx.mutation(), false for ctx.query().
  bool is_mutation = 4;
}

// RRP's answer to a CallbackRequest, sent back on the same stream, tagged with the same
// correlation_id.
message CallbackResponse {
  string correlation_id = 1;

  oneof result {
    // Success: the selection set's result, as an EngineObjectDataSerializer payload.
    bytes object_data_json = 2;

    // Failure: error information.
    ErrorInfo error = 3;
  }
}
