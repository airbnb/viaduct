# Gradle daemon/infrastructure properties. These are read before any build
# script executes and cannot be set programmatically.
#
# Because this is a composite build, prefer setting properties in the
# settings.common plugin or conventions plugins rather than here. Only
# properties that must be read before the JVM/daemon starts (org.gradle.*)
# or that are consumed by plugins before project evaluation (e.g. Dokka's
# pluginMode) belong in this file.
#
# This file is duplicated (not symlinked) across composite sub-builds because
# Gradle resolves gradle.properties relative to the settings directory. All
# copies must stay identical:
#   - gradle.properties (this file is the canonical source)
#   - core/gradle.properties
#   - gradle-plugins/gradle.properties
#   - publications/gradle.properties
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8 -XX:+EnableDynamicAgentLoading
org.gradle.configuration-cache=true
org.gradle.caching=true
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true
