name: Verify Published Snapshot
# Waits until the snapshot repository lists a build of every published coordinate stamped at or
# after built_after, then checks that every file of that build is signed with the release key.

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "airbnb/viaduct commit the snapshot was published from"
        required: true
        type: string
      version:
        description: "Published -SNAPSHOT version"
        required: true
        type: string
      built_after:
        description: "Earliest accepted build stamp (yyyyMMdd.HHmmss, UTC)"
        required: true
        type: string
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      version:
        required: true
        type: string
      built_after:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  verify-snapshot:
    name: Wait for and verify the snapshot
    runs-on: ubuntu-latest
    env:
      VIADUCT_DEPENDENCY_MIRROR_ROLE_ARN: ${{ vars.VIADUCT_DEPENDENCY_MIRROR_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}

      # The verifier and key come from the dispatched workflow, not from the published ref, which may predate them.
      - uses: actions/checkout@v6
        with:
          path: tooling

      - uses: ./.github/actions/setup-build
        with:
          java-version: '21'

      - name: Derive the published coordinates
        id: coordinates
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -uo pipefail
          LOG="${RUNNER_TEMP}/write-published-coordinates.log"
          if ./gradlew writePublishedCoordinates --no-daemon --stacktrace 2>&1 | tee "$LOG"; then
            exit 0
          fi
          if grep -q "Task 'writePublishedCoordinates' not found" "$LOG"; then
            echo "::warning::${SOURCE_SHA} predates writePublishedCoordinates, so its snapshot is neither waited for nor verified"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit 1
        shell: bash

      - name: Wait for this build and verify its signatures
        if: steps.coordinates.outputs.skip != 'true'
        env:
          VERSION: ${{ inputs.version }}
          BUILT_AFTER: ${{ inputs.built_after }}
        run: |
          set -euo pipefail
          python3 tooling/.github/scripts/verify_published_signatures.py \
            --root . --version "$VERSION" --built-after "$BUILT_AFTER" \
            --key tooling/.github/release-signing-key.asc
        shell: bash
