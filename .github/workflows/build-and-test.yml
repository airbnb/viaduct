name: Build and Test (Gradle)

on:
  workflow_dispatch:
    inputs:
      java_versions:
        description: "Java versions (array, e.g. [\"17\",\"21\"]). Defaults to [\"11\",\"17\",\"21\"]."
        required: false
        type: string
      os:
        description: "Operating system (e.g. [\"ubuntu-24.04-arm\", \"macos-15-intel\"]).  Defaults to [\"ubuntu-latest\", \"macos-latest\"]."
        required: false
        type: string
  workflow_call:
    outputs:
      run_id:
        description: "GitHub Actions run ID"
        value: ${{ jobs.validate-inputs.outputs.run_id }}

permissions:
  contents: read
  actions: read

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.emit.outputs.run_id }}
    steps:
      - name: Emit run ID
        id: emit
        run: echo "run_id=${{ github.run_id }}" >> "$GITHUB_OUTPUT"
        shell: bash
      - uses: actions/checkout@v6
      - name: Validate inputs
        env:
          OS_INPUT: ${{ inputs.os }}
          JAVA_INPUT: ${{ inputs.java_versions }}
        run: python3 .github/scripts/validate_inputs.py

  python-tests:
    runs-on: ubuntu-latest
    name: Python Script Tests
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      # Required: test_generate_changelog.py imports semantic_release
      - name: Install dependencies
        run: pip install -r .github/scripts/requirements.txt

      - name: Run tests
        run: python3 -m unittest discover -s .github/scripts/tests
        shell: bash

  build:
    needs: validate-inputs
    strategy:
      matrix:
        os: ${{ fromJSON(inputs.os || '["ubuntu-latest","macos-latest"]') }}
        java: ${{ fromJSON(inputs.java_versions || '["11", "17", "21"]') }}
    runs-on: ${{ matrix.os }}
    name: Build (Java ${{ matrix.java }}) ${{ matrix.os }}
    env:
      GRADLE_OPTS: "-Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.daemon=false"
      BUILDSCAN_PUBLISH: "true"
      BUILDSCAN_AUTOACCEPTTERMS: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-build
        with:
          java-version: ${{ matrix.java }}

      - name: Build project and compile test classes
        id: build_project
        run: |
          echo "🔨 Building project (main + test sources)..."
          if ./gradlew buildRepoForCI --scan; then
            echo "✅ Project built successfully"
          else
            echo "❌ Build failed"
            exit 1
          fi
        shell: bash

      - name: Collect build artifacts
        run: |
          echo "📦 Collecting artifacts..."
          rm -rf build/package
          mkdir -p build/package/{primary,sources,javadoc,others}

          # Primary jars (exclude sources/javadoc)
          find . -type f -path "*/build/libs/*.jar" \
            ! -name "*-sources.jar" ! -name "*-javadoc.jar" \
            -exec cp {} build/package/primary/ \; || true

          # Sources & Javadoc jars (if any)
          find . -type f -path "*/build/libs/*-sources.jar" -exec cp {} build/package/sources/ \; || true
          find . -type f -path "*/build/libs/*-javadoc.jar" -exec cp {} build/package/javadoc/ \; || true

          # (Optional) POMs or other publish files
          find . -type f -path "*/build/publications/*/*.pom" -exec cp {} build/package/others/ \; || true

          echo "✅ Collected:"
          find build/package -type f -maxdepth 2 -print
        shell: bash

      - uses: actions/upload-artifact@v6
        with:
          name: build-java-${{ matrix.java }}-${{ matrix.os }}
          path: build/

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ${{ fromJSON(inputs.os || '["ubuntu-latest","macos-latest"]') }}
        java: ${{ fromJSON(inputs.java_versions || '["11", "17", "21"]') }}
    name: Test (Java ${{ matrix.java }}) ${{ matrix.os }}
    needs: build
    env:
      GRADLE_OPTS: "-Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.daemon=false"
      BUILDSCAN_PUBLISH: "true"
      BUILDSCAN_AUTOACCEPTTERMS: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-build
        with:
          java-version: ${{ matrix.java }}
          cache-read-only: 'true'

      - uses: actions/download-artifact@v7
        with:
          name: build-java-${{ matrix.java }}-${{ matrix.os }}
          path: build/

      - name: Run tests
        id: run_tests
        run: |
          echo "🧪 Running tests..."
          if ./gradlew test --scan --continue; then
            echo "✅ Test execution completed"
          else
            echo "⚠️ Some tests failed"
            exit 1
          fi
        shell: bash

      - name: Upload JUnit test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: junit-results-java-${{ matrix.java }}-${{ matrix.os }}
          path: '**/build/test-results/test/*.xml'


  coverage-reports:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ${{ inputs.os && fromJSON(format('["{0}"]', fromJSON(inputs.os)[0])) || fromJSON('["ubuntu-latest"]') }}
        java: ${{ inputs.java_versions && fromJSON(format('["{0}"]', fromJSON(inputs.java_versions)[0])) || fromJSON('["17"]') }}
        project: ["core", "build-logic", "gradle-plugins"]
    name: Coverage (${{ matrix.project }})
    needs: build
    env:
      GRADLE_OPTS: "-Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.daemon=false"
      BUILDSCAN_PUBLISH: "true"
      BUILDSCAN_AUTOACCEPTTERMS: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-build
        with:
          java-version: ${{ matrix.java }}
          cache-read-only: 'true'

      - uses: actions/download-artifact@v7
        with:
          name: build-java-${{ matrix.java }}-${{ matrix.os }}
          path: build/

      - name: Run tests and generate coverage reports
        run: |
          ./gradlew -p ${{ matrix.project }} jacocoTestReport --no-configuration-cache --scan --continue || {
            echo "::warning::${{ matrix.project }}: jacocoTestReport had failures"
          }
        shell: bash

      - name: Generate hierarchical coverage index
        if: always() && matrix.project == 'core'
        run: |
          python3 .github/scripts/generate_coverage_index.py core core/build/reports/coverage || {
            echo "::warning::Coverage index generation failed"
          }
        shell: bash

      - name: Verify coverage thresholds
        if: always() && matrix.project == 'core'
        run: |
          # TODO: remove the || { ... } to make threshold violations a hard failure
          ./gradlew -p core testCodeCoverageVerification --no-configuration-cache --scan || {
            echo "::warning::Coverage thresholds not met — check the coverage report"
          }
        shell: bash

      - name: Upload coverage reports (core)
        if: always() && matrix.project == 'core'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-core
          path: |
            core/**/build/reports/jacoco
            core/build/reports/coverage

      - name: Upload coverage reports
        if: always() && matrix.project != 'core'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ matrix.project }}
          path: ${{ matrix.project }}/**/build/reports/jacoco

  coverage-summary:
    runs-on: ubuntu-latest
    name: Coverage Summary
    needs: coverage-reports
    if: always()
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: coverage-core
          path: core

      - uses: actions/download-artifact@v7
        with:
          name: coverage-build-logic
          path: build-logic

      - uses: actions/download-artifact@v7
        with:
          name: coverage-gradle-plugins
          path: gradle-plugins

      - name: Coverage summary
        run: python3 .github/scripts/format_coverage_summary.py core build-logic gradle-plugins >> "$GITHUB_STEP_SUMMARY"
        shell: bash


  detekt:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ${{ inputs.os && fromJSON(format('["{0}"]', fromJSON(inputs.os)[0])) || fromJSON('["ubuntu-latest"]') }}
        java: ${{ inputs.java_versions && fromJSON(format('["{0}"]', fromJSON(inputs.java_versions)[0])) || fromJSON('["17"]') }}
    name: detekt (Java ${{ matrix.java }}) ${{ matrix.os }}
    needs: build
    env:
      GRADLE_OPTS: "-Dorg.gradle.parallel=false -Dorg.gradle.caching=true -Dorg.gradle.daemon=false"
      BUILDSCAN_PUBLISH: "true"
      BUILDSCAN_AUTOACCEPTTERMS: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-build
        with:
          java-version: ${{ matrix.java }}
          cache-read-only: 'true'

      - name: Run Detekt Static Analysis
        id: run_detekt
        run: |
          echo "🧹 Running Detekt static analysis..."
          EXIT=0
          ./gradlew detekt --scan --no-daemon || EXIT=1
          ./gradlew -p build-logic detekt --no-daemon || EXIT=1
          if [ $EXIT -eq 0 ]; then
            echo "✅ Detekt analysis passed"
          else
            echo "❌ Detekt found code style violations"
            exit 1
          fi
        shell: bash

      - name: Upload Detekt reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: detekt-reports-java-${{ matrix.java }}-${{ matrix.os }}
          path: '**/build/reports/detekt/**/*'

  ktlint:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ${{ inputs.os && fromJSON(format('["{0}"]', fromJSON(inputs.os)[0])) || fromJSON('["ubuntu-latest"]') }}
        java: ${{ inputs.java_versions && fromJSON(format('["{0}"]', fromJSON(inputs.java_versions)[0])) || fromJSON('["17"]') }}
    name: ktlint (Java ${{ matrix.java }}) ${{ matrix.os }}
    needs: build
    env:
      GRADLE_OPTS: "-Dorg.gradle.parallel=false -Dorg.gradle.caching=true -Dorg.gradle.daemon=false"
      BUILDSCAN_PUBLISH: "true"
      BUILDSCAN_AUTOACCEPTTERMS: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-build
        with:
          java-version: ${{ matrix.java }}
          cache-read-only: 'true'

      - name: Run Ktlint Code Formatting Check
        id: run_ktlint
        run: |
          echo "🧹 Running Ktlint code formatting check..."
          if ./gradlew ktlintCheck --scan --no-daemon; then
            echo "✅ Ktlint formatting check passed"
          else
            echo "❌ Ktlint found code formatting violations"
            exit 1
          fi
        shell: bash

  dokka:
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      matrix:
        os: ${{ inputs.os && fromJSON(format('["{0}"]', fromJSON(inputs.os)[0])) || fromJSON('["ubuntu-latest"]') }}
        java: ${{ inputs.java_versions && fromJSON(format('["{0}"]', fromJSON(inputs.java_versions)[0])) || fromJSON('["17"]') }}
    name: dokka (Java ${{ matrix.java }}) ${{ matrix.os }}
    needs: build
    env:
      GRADLE_OPTS: "-Dorg.gradle.parallel=false -Dorg.gradle.caching=true -Dorg.gradle.daemon=false"
      BUILDSCAN_PUBLISH: "true"
      BUILDSCAN_AUTOACCEPTTERMS: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-build
        with:
          java-version: ${{ matrix.java }}
          cache-read-only: 'true'

      # Pinned 3.13 due to incompatibility between djlint and 3.14
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: pip install -r docs/requirements.txt

      - name: Verify Dokka output
        run: |
          echo "🔨 Building mkdocs site..."
          cd docs
          mkdocs build
          cd ..

          echo "🔨 Generating Dokka API documentation..."
          ./gradlew :core:tenant:api:dokkaGenerate :core:service:dokkaGenerate :core:x:javaapi:api:dokkaGenerate || { echo "❌ Dokka failed"; exit 1; }

          echo "📖 Verifying Dokka documentation output..."

          # Check tenant-api docs
          if [ ! -f "docs/site/apis/tenant-api/index.html" ]; then
            echo "❌ Missing tenant-api Dokka output: docs/site/apis/tenant-api/index.html"
            exit 1
          fi
          echo "✅ tenant-api docs present"

          # Check service aggregated docs
          if [ ! -f "docs/site/apis/service/index.html" ]; then
            echo "❌ Missing service Dokka output: docs/site/apis/service/index.html"
            exit 1
          fi
          echo "✅ service docs present"

          # Verify service docs contain aggregated modules
          if [ ! -d "docs/site/apis/service/service/api" ]; then
            echo "❌ Missing aggregated api module in service docs"
            exit 1
          fi
          if [ ! -d "docs/site/apis/service/service/wiring" ]; then
            echo "❌ Missing aggregated wiring module in service docs"
            exit 1
          fi
          echo "✅ service docs contain aggregated modules (api, wiring)"

          PYTHONPATH=docs:$PYTHONPATH djlint docs/site/ --lint \
            --ignore "H005,H006,H013,H014,H020,H021,H023,H025,H026,H030,H031" \
            --exclude "apis/" \
            --include "LINK001" || { echo "❌ Site contains broken links"; exit 1; }

          echo "✅ All Dokka documentation verified successfully"
        shell: bash

