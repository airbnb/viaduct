name: Build and Test (Gradle)

on:
  workflow_dispatch:
    inputs:
      java_versions:
        description: "Java versions (array, e.g. [\"17\",\"21\"]). Defaults to [\"17\",\"11\",\"21\"].  The first element in this list is used for linting and coverage reporting."
        required: false
        type: string
      os:
        description: "Operating system (e.g. [\"ubuntu-24.04-arm\", \"macos-15-intel\"]).  Defaults to [\"ubuntu-latest\", \"macos-latest\"].  The first element in this list is used for linting and coverage reporting."
        required: false
        type: string
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:

env:
  GRADLE_OPTS: "-Dorg.gradle.parallel=false -Dorg.gradle.caching=true -Dorg.gradle.daemon=false"
  BUILDSCAN_PUBLISH: "true"
  BUILDSCAN_AUTOACCEPTTERMS: "true"

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    outputs:
      coverage_os: ${{ steps.validate.outputs.coverage_os }}
      coverage_java: ${{ steps.validate.outputs.coverage_java }}
      has_wide: ${{ steps.validate.outputs.has_wide }}
      wide_matrix: ${{ steps.validate.outputs.wide_matrix }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install -r .github/scripts/requirements.txt

      - name: Run CI script tests
        run: |
          cd .github/scripts/tests
          python3 -m unittest discover
        shell: bash

      - name: Validate inputs
        id: validate
        env:
          OS_INPUT: ${{ inputs.os }}
          JAVA_INPUT: ${{ inputs.java_versions }}
        run: python3 .github/scripts/validate_inputs.py

  # Deep build: single coordinate (first OS × first Java). Runs assembly and
  # uploads the build artifact for test-deep and docs-verify to consume.
  build-deep:
    needs: validate-inputs
    runs-on: ${{ needs['validate-inputs'].outputs.coverage_os }}
    name: Build (deep)
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-build
        with:
          java-version: ${{ needs['validate-inputs'].outputs.coverage_java }}

      - name: Download dependencies
        run: |
          echo "📥 Downloading Gradle dependencies..."
          ./gradlew dependencies || {
            echo "❌ Failed to download dependencies"
            exit 1
          }
          echo "✅ Dependencies downloaded successfully"
        shell: bash

      - name: Build project (without tests)
        id: build_project
        run: |
          echo "🔨 Building project..."
          ./gradlew assemble --scan || { echo "❌ Assemble failed"; exit 1; }
          echo "✅ Project built successfully"
        shell: bash

      - name: Save build scan URL
        id: save_build_scan_url
        if: ${{ failure() && steps.build_project.conclusion == 'failure' }}
        run: |
          mkdir -p build-scan-urls
          echo "${{ steps.build_project.outputs.build-scan-url }}" > build-scan-urls/build-assemble.txt
          echo "${{ github.event.pull_request.number }}" > build-scan-urls/pr-number.txt
        shell: bash

      - name: Collect build artifacts
        run: |
          echo "📦 Collecting artifacts..."
          rm -rf build/package
          mkdir -p build/package/{primary,sources,javadoc,others}

          # Primary jars (exclude sources/javadoc)
          find . -type f -path "*/build/libs/*.jar" \
            ! -name "*-sources.jar" ! -name "*-javadoc.jar" \
            -exec cp {} build/package/primary/ \; || true

          # Sources & Javadoc jars (if any)
          find . -type f -path "*/build/libs/*-sources.jar" -exec cp {} build/package/sources/ \; || true
          find . -type f -path "*/build/libs/*-javadoc.jar" -exec cp {} build/package/javadoc/ \; || true

          # (Optional) POMs or other publish files
          find . -type f -path "*/build/publications/*/*.pom" -exec cp {} build/package/others/ \; || true

          echo "✅ Collected:"
          find build/package -type f -maxdepth 2 -print
        shell: bash

      - uses: actions/upload-artifact@v6
        with:
          name: build-deep
          path: build/

      - name: Upload build scan URLs
        if: ${{ steps.save_build_scan_url.conclusion == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: build-scan-urls-build-deep
          path: build-scan-urls/

  # Deep test: same single coordinate as build-deep. Runs testWithCoverage
  # (tests + coverage report + coverage verification) and CI script tests.
  test-deep:
    runs-on: ${{ needs['validate-inputs'].outputs.coverage_os }}
    name: Test (deep)
    needs: [build-deep, validate-inputs]
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-build
        with:
          java-version: ${{ needs['validate-inputs'].outputs.coverage_java }}
          cache-read-only: 'true'

      - uses: actions/download-artifact@v7
        with:
          name: build-deep
          path: build/

      - name: Run tests with coverage
        id: run_tests_with_coverage
        run: |
          echo "🧪 Running tests with coverage..."
          ./gradlew testWithCoverage --no-configuration-cache --scan || {
            echo "❌ Tests or coverage verification failed"
            exit 1
          }
          echo "✅ Tests and coverage completed"
        shell: bash

      - name: Save test build scan URL
        id: save_test_scan_url
        if: failure() && steps.run_tests_with_coverage.conclusion == 'failure'
        run: |
          mkdir -p build-scan-urls
          echo "${{ steps.run_tests_with_coverage.outputs.build-scan-url }}" > build-scan-urls/test.txt
          echo "${{ github.event.pull_request.number }}" > build-scan-urls/pr-number.txt
        shell: bash

      - name: Upload JUnit test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: junit-results-deep
          path: '**/build/test-results/test/*.xml'

      - name: Upload JaCoCo coverage reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-reports-deep
          path: build/reports/jacoco

      - name: Upload all reports (for debugging)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: all-reports-deep
          path: build/reports

      - name: Upload build scan URLs
        if: ${{ steps.save_test_scan_url.conclusion == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: build-scan-urls-test-deep
          path: build-scan-urls/

  # Docs verification: runs in parallel with test-deep. Generates Dokka API
  # docs from the build-deep artifact, builds the mkdocs site, and checks for
  # broken links with djlint.
  docs-verify:
    needs: [build-deep, validate-inputs]
    runs-on: ${{ needs['validate-inputs'].outputs.coverage_os }}
    name: Docs verify
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-build
        with:
          java-version: ${{ needs['validate-inputs'].outputs.coverage_java }}
          cache-read-only: 'true'

      - uses: actions/download-artifact@v7
        with:
          name: build-deep
          path: build/

      # Pinned 3.13 due to incompatibility between djlint and 3.14
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: pip install -r docs/requirements.txt

      - name: Verify Dokka output
        run: |
          echo "🔨 Building mkdocs site..."
          cd docs
          mkdocs build
          cd ..

          echo "🔨 Generating Dokka API documentation..."
          ./gradlew :core:tenant:tenant-api:dokkaGenerate :core:service:dokkaGenerate :core:x:javaapi:x-javaapi-api:dokkaGenerate || { echo "❌ Dokka failed"; exit 1; }

          echo "📖 Verifying Dokka documentation output..."

          # Check tenant-api docs
          if [ ! -f "docs/site/apis/tenant-api/index.html" ]; then
            echo "❌ Missing tenant-api Dokka output: docs/site/apis/tenant-api/index.html"
            exit 1
          fi
          echo "✅ tenant-api docs present"

          # Check service aggregated docs
          if [ ! -f "docs/site/apis/service/index.html" ]; then
            echo "❌ Missing service Dokka output: docs/site/apis/service/index.html"
            exit 1
          fi
          echo "✅ service docs present"

          # Verify service docs contain aggregated modules
          if [ ! -d "docs/site/apis/service/service/service-api" ]; then
            echo "❌ Missing aggregated service-api module in service docs"
            exit 1
          fi
          if [ ! -d "docs/site/apis/service/service/service-wiring" ]; then
            echo "❌ Missing aggregated service-wiring module in service docs"
            exit 1
          fi
          echo "✅ service docs contain aggregated modules (service-api, service-wiring)"

          PYTHONPATH=docs:$PYTHONPATH djlint docs/site/ --lint \
            --ignore "H005,H006,H013,H014,H020,H021,H023,H025,H026,H030,H031" \
            --exclude "apis/" \
            --include "LINK001" || { echo "❌ Site contains broken links"; exit 1; }

          echo "✅ All Dokka documentation verified successfully"
        shell: bash

  # Wide test: full OS × Java matrix minus the deep coordinate. Runs
  # ./gradlew test (which handles its own build via Gradle task dependencies)
  # with no artifact dependency on build-deep, so all coordinates start
  # as soon as validate-inputs completes.
  test-wide:
    if: needs['validate-inputs'].outputs.has_wide == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include: ${{ fromJSON(needs['validate-inputs'].outputs.wide_matrix) }}
    name: Test wide (Java ${{ matrix.java }}) ${{ matrix.os }}
    needs: validate-inputs
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-build
        with:
          java-version: ${{ matrix.java }}

      - name: Run tests
        run: |
          echo "🧪 Running tests..."
          ./gradlew test --scan --continue || {
            echo "⚠️ Some tests failed, but continuing"
            echo "Test failures are not blocking the pipeline"
          }
          echo "✅ Test execution completed"
        shell: bash

      - name: Upload JUnit test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: junit-results-java-${{ matrix.java }}-${{ matrix.os }}
          path: '**/build/test-results/test/*.xml'

      - name: Upload all reports (for debugging)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: all-reports-java-${{ matrix.java }}-${{ matrix.os }}
          path: build/reports

  detekt:
    runs-on: ${{ needs['validate-inputs'].outputs.coverage_os }}
    name: detekt
    needs: validate-inputs
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-build
        with:
          java-version: ${{ needs['validate-inputs'].outputs.coverage_java }}
          cache-read-only: 'true'

      - name: Run Detekt Static Analysis
        id: run_detekt
        run: |
          echo "🧹 Running Detekt static analysis..."
          ./gradlew detekt --no-daemon --max-workers=1 || {
            echo "❌ Detekt found code style violations"
            exit 1
          }
          echo "✅ Detekt analysis passed"
        shell: bash

      - name: Save detekt build scan URL
        id: save_detekt_scan_url
        if: ${{ failure() && steps.run_detekt.conclusion == 'failure' }}
        run: |
          mkdir -p build-scan-urls
          echo "${{ steps.run_detekt.outputs.build-scan-url }}" > build-scan-urls/detekt.txt
          echo "${{ github.event.pull_request.number }}" > build-scan-urls/pr-number.txt
        shell: bash

      - name: Upload Detekt reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: detekt-reports
          path: '**/build/reports/detekt/**/*'

      - name: Upload build scan URLs
        if: ${{ steps.save_detekt_scan_url.conclusion == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: build-scan-urls-detekt
          path: build-scan-urls/

  ktlint:
    runs-on: ${{ needs['validate-inputs'].outputs.coverage_os }}
    name: ktlint
    needs: validate-inputs
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-build
        with:
          java-version: ${{ needs['validate-inputs'].outputs.coverage_java }}
          cache-read-only: 'true'

      - name: Run Ktlint Code Formatting Check
        id: run_ktlint
        run: |
          echo "🧹 Running Ktlint code formatting check..."
          ./gradlew ktlintCheck --no-daemon --max-workers=1 || {
            echo "❌ Ktlint found code formatting violations"
            exit 1
          }
          echo "✅ Ktlint formatting check passed"
        shell: bash

      - name: Save ktlint build scan URL
        id: save_ktlint_scan_url
        if: ${{ failure() && steps.run_ktlint.conclusion == 'failure' }}
        run: |
          mkdir -p build-scan-urls
          echo "${{ steps.run_ktlint.outputs.build-scan-url }}" > build-scan-urls/ktlint.txt
          echo "${{ github.event.pull_request.number }}" > build-scan-urls/pr-number.txt
        shell: bash

      - name: Upload build scan URLs
        if: ${{ steps.save_ktlint_scan_url.conclusion == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: build-scan-urls-ktlint
          path: build-scan-urls/

  collect-failure-info:
    runs-on: ubuntu-latest
    needs: [validate-inputs, build-deep, test-deep, docs-verify, test-wide, detekt, ktlint]
    if: failure()
    steps:
      - name: Collect failure metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=${{ github.run_id }}

          failed_jobs=$(gh api repos/${{ github.repository }}/actions/runs/$run_id/jobs \
            --jq '[.jobs[] | select(.conclusion=="failure") | .name] | join(", ")')

          failed_steps=$(gh api repos/${{ github.repository }}/actions/runs/$run_id/jobs \
            --jq '[.jobs[] | select(.conclusion=="failure") | .steps[] | select(.conclusion=="failure") | .name] | join(", ")')

          mkdir -p slack-alert
          cat > slack-alert/failure-info.json <<EOF
          {
            "workflow": "${{ github.workflow }}",
            "run_number": "${{ github.run_number }}",
            "repository": "${{ github.event.repository.name }}",
            "failed_jobs": "$failed_jobs",
            "failed_steps": "$failed_steps",
            "branch": "${{ github.ref_name }}",
            "actor": "${{ github.actor }}",
            "sha": "${{ github.sha }}",
            "server_url": "${{ github.server_url }}",
            "repository_full": "${{ github.repository }}",
            "run_id": "${{ github.run_id }}"
          }
          EOF
        shell: bash

      - name: Upload failure info artifact
        uses: actions/upload-artifact@v6
        with:
          name: slack-alert
          path: slack-alert/
