name: Build and Test (Gradle)

on:
  workflow_dispatch:
    inputs:
      java_versions:
        description: "Java versions (array, e.g. [\"17\",\"21\"]). Defaults to [\"11\",\"17\",\"21\"]."
        required: false
        type: string
      os:
        description: "Operating system (e.g. [\"ubuntu-24.04-arm\", \"macos-15-intel\"]).  Defaults to [\"ubuntu-latest\", \"macos-latest\"]."
        required: false
        type: string
  workflow_call:
    outputs:
      run_id:
        description: "GitHub Actions run ID"
        value: ${{ jobs.validate-inputs.outputs.run_id }}

permissions:
  contents: read
  actions: read

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.emit.outputs.run_id }}
    steps:
      - name: Emit run ID
        id: emit
        run: echo "run_id=${{ github.run_id }}" >> "$GITHUB_OUTPUT"
        shell: bash
      - uses: actions/checkout@v6
      - name: Validate inputs
        env:
          OS_INPUT: ${{ inputs.os }}
          JAVA_INPUT: ${{ inputs.java_versions }}
        run: python3 .github/scripts/validate_inputs.py

  python-tests:
    runs-on: ubuntu-latest
    name: Python Script Tests
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      # Required: test_generate_changelog.py imports semantic_release
      - name: Install dependencies
        run: pip install -r .github/scripts/requirements.txt

      - name: Run tests
        run: python3 -m unittest discover -s .github/scripts/tests
        shell: bash

  build:
    needs: validate-inputs
    strategy:
      matrix:
        os: ${{ fromJSON(inputs.os || '["ubuntu-latest","macos-latest"]') }}
        java: ${{ fromJSON(inputs.java_versions || '["11", "17", "21"]') }}
    runs-on: ${{ matrix.os }}
    name: Build (Java ${{ matrix.java }}) ${{ matrix.os }}
    env:
      GRADLE_OPTS_EXTRA: "-Dorg.gradle.parallel=false -Dorg.gradle.caching=true -Dorg.gradle.daemon=false"
      BUILDSCAN_PUBLISH: "true"
      BUILDSCAN_AUTOACCEPTTERMS: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-build
        with:
          java-version: ${{ matrix.java }}

      - name: Download dependencies
        run: |
          echo "📥 Downloading Gradle dependencies..."
          ./gradlew dependencies || {
            echo "❌ Failed to download dependencies"
            exit 1
          }
          echo "✅ Dependencies downloaded successfully"
        shell: bash

      # Pinned 3.13 due to incompatibility between djlint and 3.14
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r docs/requirements.txt

      - name: Build project (without tests)
        id: build_project
        run: |
          echo "🔨 Building project..."
          if ./gradlew assemble --scan; then
            echo "✅ Project built successfully"
          else
            echo "❌ Assemble failed"
            exit 1
          fi
        shell: bash

      - name: Verify Dokka output
        run: |
          echo "🔨 Building Dokka documentation..."
          cd docs
          mkdocs build
          cd ..

          echo "🔨 Building Dokka documentation..."
          ./gradlew :core:tenant:tenant-api:dokkaGenerate :core:service:dokkaGenerate :core:x:javaapi:javaapi-api:dokkaGenerate || { echo "❌ Dokka failed"; exit 1; }

          echo "📖 Verifying Dokka documentation output..."

          # Check tenant-api docs
          if [ ! -f "docs/site/apis/tenant-api/index.html" ]; then
            echo "❌ Missing tenant-api Dokka output: docs/site/apis/tenant-api/index.html"
            exit 1
          fi
          echo "✅ tenant-api docs present"

          # Check service aggregated docs
          if [ ! -f "docs/site/apis/service/index.html" ]; then
            echo "❌ Missing service Dokka output: docs/site/apis/service/index.html"
            exit 1
          fi
          echo "✅ service docs present"

          # Verify service docs contain aggregated modules
          if [ ! -d "docs/site/apis/service/service/service-api" ]; then
            echo "❌ Missing aggregated service-api module in service docs"
            exit 1
          fi
          if [ ! -d "docs/site/apis/service/service/service-wiring" ]; then
            echo "❌ Missing aggregated service-wiring module in service docs"
            exit 1
          fi
          echo "✅ service docs contain aggregated modules (service-api, service-wiring)"

          PYTHONPATH=docs:$PYTHONPATH djlint docs/site/ --lint \
            --ignore "H005,H006,H013,H014,H020,H021,H023,H025,H026,H030,H031" \
            --exclude "apis/" \
            --include "LINK001" || { echo "❌ Site contains broken links"; exit 1; }

          echo "✅ All Dokka documentation verified successfully"
        shell: bash

      - name: Collect build artifacts
        run: |
          echo "📦 Collecting artifacts..."
          rm -rf build/package
          mkdir -p build/package/{primary,sources,javadoc,others}

          # Primary jars (exclude sources/javadoc)
          find . -type f -path "*/build/libs/*.jar" \
            ! -name "*-sources.jar" ! -name "*-javadoc.jar" \
            -exec cp {} build/package/primary/ \; || true

          # Sources & Javadoc jars (if any)
          find . -type f -path "*/build/libs/*-sources.jar" -exec cp {} build/package/sources/ \; || true
          find . -type f -path "*/build/libs/*-javadoc.jar" -exec cp {} build/package/javadoc/ \; || true

          # (Optional) POMs or other publish files
          find . -type f -path "*/build/publications/*/*.pom" -exec cp {} build/package/others/ \; || true

          echo "✅ Collected:"
          find build/package -type f -maxdepth 2 -print
        shell: bash

      - uses: actions/upload-artifact@v6
        with:
          name: build-java-${{ matrix.java }}-${{ matrix.os }}
          path: build/

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ${{ fromJSON(inputs.os || '["ubuntu-latest","macos-latest"]') }}
        java: ${{ fromJSON(inputs.java_versions || '["11", "17", "21"]') }}
    name: Test (Java ${{ matrix.java }}) ${{ matrix.os }}
    needs: build
    env:
      GRADLE_OPTS_EXTRA: "-Dorg.gradle.parallel=false -Dorg.gradle.caching=true -Dorg.gradle.daemon=false"
      BUILDSCAN_PUBLISH: "true"
      BUILDSCAN_AUTOACCEPTTERMS: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-build
        with:
          java-version: ${{ matrix.java }}
          cache-read-only: 'true'

      - uses: actions/download-artifact@v7
        with:
          name: build-java-${{ matrix.java }}-${{ matrix.os }}
          path: build/

      - name: Run tests
        id: run_tests
        run: |
          echo "🧪 Running tests..."
          if ./gradlew test --scan --continue; then
            echo "✅ Test execution completed"
          else
            echo "⚠️ Some tests failed"
            exit 1
          fi
        shell: bash

      - name: Generate coverage and test reports
        if: always()
        run: |
          echo "📊 Generating coverage reports..."
          ./gradlew -p core testAndCoverage --no-configuration-cache || {
            echo "::warning::Failed to generate aggregated report"
          }
          ./gradlew -p core jacocoTestReport --no-configuration-cache || true
          echo "✅ Reports generated"
        shell: bash

      - name: Coverage summary
        if: always()
        run: python3 .github/scripts/format_coverage_summary.py core >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Upload JUnit test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: junit-results-java-${{ matrix.java }}-${{ matrix.os }}
          path: '**/build/test-results/test/*.xml'

      - name: Upload JaCoCo coverage reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-reports-java-${{ matrix.java }}-${{ matrix.os }}
          path: core/build/reports/jacoco

      - name: Upload all reports (for debugging)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: all-reports-java-${{ matrix.java }}-${{ matrix.os }}
          path: core/build/reports


  detekt:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ${{ inputs.os && fromJSON(format('["{0}"]', fromJSON(inputs.os)[0])) || fromJSON('["ubuntu-latest"]') }}
        java: ${{ inputs.java_versions && fromJSON(format('["{0}"]', fromJSON(inputs.java_versions)[0])) || fromJSON('["17"]') }}
    name: detekt (Java ${{ matrix.java }}) ${{ matrix.os }}
    needs: build
    env:
      GRADLE_OPTS_EXTRA: "-Dorg.gradle.parallel=false -Dorg.gradle.caching=true -Dorg.gradle.daemon=false"
      BUILDSCAN_PUBLISH: "true"
      BUILDSCAN_AUTOACCEPTTERMS: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-build
        with:
          java-version: ${{ matrix.java }}
          cache-read-only: 'true'

      - name: Run Detekt Static Analysis
        id: run_detekt
        run: |
          echo "🧹 Running Detekt static analysis..."
          if ./gradlew detekt --scan --no-daemon --max-workers=1; then
            echo "✅ Detekt analysis passed"
          else
            echo "❌ Detekt found code style violations"
            exit 1
          fi
        shell: bash

      - name: Upload Detekt reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: detekt-reports-java-${{ matrix.java }}-${{ matrix.os }}
          path: '**/build/reports/detekt/**/*'

  ktlint:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ${{ inputs.os && fromJSON(format('["{0}"]', fromJSON(inputs.os)[0])) || fromJSON('["ubuntu-latest"]') }}
        java: ${{ inputs.java_versions && fromJSON(format('["{0}"]', fromJSON(inputs.java_versions)[0])) || fromJSON('["17"]') }}
    name: ktlint (Java ${{ matrix.java }}) ${{ matrix.os }}
    needs: build
    env:
      GRADLE_OPTS_EXTRA: "-Dorg.gradle.parallel=false -Dorg.gradle.caching=true -Dorg.gradle.daemon=false"
      BUILDSCAN_PUBLISH: "true"
      BUILDSCAN_AUTOACCEPTTERMS: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-build
        with:
          java-version: ${{ matrix.java }}
          cache-read-only: 'true'

      - name: Run Ktlint Code Formatting Check
        id: run_ktlint
        run: |
          echo "🧹 Running Ktlint code formatting check..."
          if ./gradlew ktlintCheck --scan --no-daemon --max-workers=1; then
            echo "✅ Ktlint formatting check passed"
          else
            echo "❌ Ktlint found code formatting violations"
            exit 1
          fi
        shell: bash

  coverage-verification:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ${{ inputs.os && fromJSON(format('["{0}"]', fromJSON(inputs.os)[0])) || fromJSON('["ubuntu-latest"]') }}
        java: ${{ inputs.java_versions && fromJSON(format('["{0}"]', fromJSON(inputs.java_versions)[0])) || fromJSON('["17"]') }}
    name: coverage verification (Java ${{ matrix.java }}) ${{ matrix.os }}
    needs: test
    if: failure() || success()
    env:
      GRADLE_OPTS_EXTRA: "-Dorg.gradle.parallel=false -Dorg.gradle.caching=true -Dorg.gradle.daemon=false"
      BUILDSCAN_PUBLISH: "true"
      BUILDSCAN_AUTOACCEPTTERMS: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-build
        with:
          java-version: ${{ matrix.java }}
          cache-read-only: 'true'

      - name: Verify coverage thresholds
        id: verify_coverage
        run: |
          echo "🎯 Verifying coverage thresholds..."
          if ./gradlew -p core jacocoTestCoverageVerification --scan --no-configuration-cache; then
            echo "✅ Coverage thresholds met successfully"
          else
            echo "::warning::Coverage thresholds not met — check the coverage report"
          fi
        shell: bash


