name: Nightly Build
# Thin cron wrapper — delegates to demoapps-nightly-check.yml.
# No domain logic belongs here. This is just a scheduling entrypoint.

on:
  schedule:
    - cron: '0 6 * * 1-5'  # 6 AM UTC, weekdays
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nightly:
    uses: ./.github/workflows/demoapps-nightly-check.yml
    with:
      ref: main
      run_ci_check: true
    secrets: inherit

  windows-check:
    runs-on: windows-latest
    strategy:
      matrix:
        java: ["17", "21"]
    name: Full Check (Windows, Java ${{ matrix.java }})
    env:
      GRADLE_OPTS: "-Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.daemon=false"
      BUILDSCAN_PUBLISH: "true"
      BUILDSCAN_AUTOACCEPTTERMS: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-build
        with:
          java-version: ${{ matrix.java }}

      - name: Check
        run: ./gradlew check --scan
        shell: bash
