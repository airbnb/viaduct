name: Dependency Mirror Check

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  VIADUCT_DEPENDENCY_MIRROR_ROLE_ARN: ${{ vars.VIADUCT_DEPENDENCY_MIRROR_ROLE_ARN }}

jobs:
  build-through-mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c  # v5
        with:
          cache-disabled: true

      - name: Configure dependency mirror
        run: bash .github/scripts/configure-dependency-mirror.sh
        shell: bash

      - name: Require the mirror
        run: |
          if [ -z "${VIADUCT_ARTIFACTORY_MIRROR:-}" ]; then
            echo "::error::The dependency mirror was not configured; see the warning from the previous step."
            exit 1
          fi
        shell: bash

      - name: Build shared:utils through the mirror
        run: ./gradlew -p core :shared:utils:test --no-daemon
        shell: bash
