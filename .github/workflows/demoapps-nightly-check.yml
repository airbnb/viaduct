name: Demoapp Nightly Check
# End-to-end snapshot validation orchestrator.
# Exercises the exact artifact path downstream users consume:
#   publish snapshots -> push demoapps -> wait for visibility -> verify standalone repos
#
# This is the centerpiece of RFC-267 — it closes the mavenLocal/Maven Central gap.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to validate"
        required: true
        type: string
        default: main
      run_ci_check:
        description: "Run CI precheck before snapshot publication"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      run_ci_check:
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: nightly-check-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Optional CI precheck — stop early if mavenLocal tests are broken
  # ---------------------------------------------------------------------------
  ci-precheck:
    if: inputs.run_ci_check
    uses: ./.github/workflows/demoapps-ci-check.yml

  # ---------------------------------------------------------------------------
  # Publish snapshot artifacts to Sonatype OSSRH
  # ---------------------------------------------------------------------------
  publish-snapshot:
    needs: [ci-precheck]
    if: always() && (needs.ci-precheck.result == 'success' || needs.ci-precheck.result == 'skipped')
    uses: ./.github/workflows/publish-branch.yml
    with:
      mode: snapshot
      ref: ${{ inputs.ref }}
      run_checks: false
      confirm_versions: true
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Push demoapp code to viaduct-dev/* repos via Copybara
  # Runs in parallel with wait-for-publication (both depend on publish-snapshot)
  # ---------------------------------------------------------------------------
  push-demoapps:
    needs: [publish-snapshot]
    uses: ./.github/workflows/push-demoapps.yml
    with:
      ref: ${{ inputs.ref }}
      release_mode: false
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Poll Sonatype until snapshot artifacts are visible
  # Runs in parallel with push-demoapps
  # ---------------------------------------------------------------------------
  wait-for-publication:
    needs: [publish-snapshot]
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Sonatype snapshot visibility
        env:
          VERSION: ${{ needs.publish-snapshot.outputs.version }}
        run: |
          set -euo pipefail
          URL="https://central.sonatype.com/repository/maven-snapshots/com/airbnb/viaduct/api/${VERSION}/"
          echo "Waiting for ${URL} to return 200..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            if [ "$STATUS" = "200" ]; then
              echo "Artifacts visible after ${i} attempts"
              exit 0
            fi
            echo "Attempt ${i}: HTTP ${STATUS}, waiting 30s..."
            sleep 30
          done
          echo "::error::Timed out waiting for Sonatype snapshot visibility after 15 minutes"
          exit 1
        shell: bash

  # ---------------------------------------------------------------------------
  # Verify standalone repos build against published snapshot artifacts
  # ---------------------------------------------------------------------------
  check-demoapps:
    needs: [push-demoapps, wait-for-publication]
    uses: ./.github/workflows/check-published-demoapps.yml
    with:
      ref: ${{ needs.push-demoapps.outputs.destination_branch }}
      use_snapshot_repo: true

  # ---------------------------------------------------------------------------
  # Alert on failure — post to Slack and Discord
  # ---------------------------------------------------------------------------
  format-alerts:
    needs: [publish-snapshot, push-demoapps, wait-for-publication, check-demoapps]
    runs-on: ubuntu-latest
    if: >-
      always()
      && (needs.publish-snapshot.result == 'failure'
          || needs.push-demoapps.result == 'failure'
          || needs.wait-for-publication.result == 'failure'
          || needs.check-demoapps.result == 'failure')
    outputs:
      text: ${{ steps.fmt.outputs.text }}
    steps:
      - uses: actions/checkout@v6

      - name: Build failed-jobs list
        id: jobs
        env:
          PUBLISH_RESULT: ${{ needs.publish-snapshot.result }}
          PUSH_RESULT: ${{ needs.push-demoapps.result }}
          WAIT_RESULT: ${{ needs.wait-for-publication.result }}
          CHECK_RESULT: ${{ needs.check-demoapps.result }}
        run: |
          jobs_json='[]'
          if [ "$PUBLISH_RESULT" = "failure" ]; then
            jobs_json=$(echo "$jobs_json" | jq -c --arg name "Publish Snapshot" --arg run_id "${{ github.run_id }}" '. + [{"name": $name, "run_id": $run_id}]')
          fi
          if [ "$PUSH_RESULT" = "failure" ]; then
            jobs_json=$(echo "$jobs_json" | jq -c --arg name "Push Demoapps" --arg run_id "${{ github.run_id }}" '. + [{"name": $name, "run_id": $run_id}]')
          fi
          if [ "$WAIT_RESULT" = "failure" ]; then
            jobs_json=$(echo "$jobs_json" | jq -c --arg name "Wait for Publication" --arg run_id "${{ github.run_id }}" '. + [{"name": $name, "run_id": $run_id}]')
          fi
          if [ "$CHECK_RESULT" = "failure" ]; then
            jobs_json=$(echo "$jobs_json" | jq -c --arg name "Check Demoapps" --arg run_id "${{ github.run_id }}" '. + [{"name": $name, "run_id": $run_id}]')
          fi
          echo "jobs_json=${jobs_json}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Format alert
        id: fmt
        uses: ./.github/actions/collect-failure-info
        with:
          jobs_json: ${{ steps.jobs.outputs.jobs_json }}
          branch: ${{ inputs.ref }}
          server_url: ${{ github.server_url }}
          repository: ${{ github.repository }}
          sha: ${{ github.sha }}
          actor: ${{ github.actor }}
          attempt: ${{ github.run_attempt }}

  send-alerts:
    needs: [format-alerts]
    if: always() && needs.format-alerts.result == 'success'
    uses: ./.github/workflows/post-alerts.yml
    with:
      text: ${{ needs.format-alerts.outputs.text }}
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Delete temporary branches in viaduct-dev/* repos (ephemeral refs only).
  # Runs only when check-demoapps succeeded, so a failed run keeps its branches and
  # "Re-run failed jobs" can re-clone them. Stale tmp/* branches from failed or
  # cleanup-less runs are reaped by sweep-tmp-branches.yml.
  # ---------------------------------------------------------------------------
  cleanup:
    needs: [push-demoapps, check-demoapps]
    if: always() && startsWith(needs.push-demoapps.outputs.destination_branch, 'tmp/') && needs.check-demoapps.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        demoapp: [cli-starter, jetty-starter, ktor-starter, micronaut-starter, starwars]
    name: Cleanup ${{ matrix.demoapp }}
    steps:
      - name: Delete temporary branch
        env:
          GH_TOKEN: ${{ secrets.VIADUCT_GRAPHQL_GITHUB_ACCESS_TOKEN }}
          DEST_BRANCH: ${{ needs.push-demoapps.outputs.destination_branch }}
          DEMOAPP: ${{ matrix.demoapp }}
        run: |
          set -euo pipefail

          # Defense-in-depth: verify this is a tmp/ branch
          if [[ "$DEST_BRANCH" != tmp/* ]]; then
            echo "::error::Refusing to delete non-temporary branch '${DEST_BRANCH}'"
            exit 1
          fi

          # Resolve the branch SHA (logged for recovery) and require a real commit
          # SHA before deleting. gh api emits its JSON error body on stdout for a
          # missing ref, so a non-empty value alone does not mean the branch exists.
          SHA=$(gh api "repos/viaduct-dev/${DEMOAPP}/git/refs/heads/${DEST_BRANCH}" \
            --jq '.object.sha' 2>/dev/null || true)
          if ! [[ "$SHA" =~ ^[0-9a-f]{40,64}$ ]]; then
            echo "Branch '${DEST_BRANCH}' not found in viaduct-dev/${DEMOAPP} (already deleted?) — skipping"
            exit 0
          fi
          echo "Branch '${DEST_BRANCH}' in viaduct-dev/${DEMOAPP} points to ${SHA}"

          # Delete the branch
          gh api -X DELETE "repos/viaduct-dev/${DEMOAPP}/git/refs/heads/${DEST_BRANCH}"
          echo "Deleted successfully (recoverable via: git update-ref refs/heads/${DEST_BRANCH} ${SHA})"
        shell: bash
