name: Post Alerts

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "test-posts verifies connectivity"
        required: true
        type: choice
        options:
          - test-posts

  workflow_call:
    inputs:
      text:
        description: "Alert text to post (produced by format_alert.py)"
        required: true
        type: string

concurrency:
  group: post-alerts-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  format-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test-posts'
    outputs:
      text: ${{ steps.fmt.outputs.text }}
    steps:
      - uses: actions/checkout@v6

      - name: Diagnose Slack channel
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
        run: |
          echo "Channel ID: '${CHANNEL_ID}'"
          echo "Token length: ${#SLACK_BOT_TOKEN}"
          resp=$(curl -sS -X GET \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            "https://slack.com/api/conversations.info?channel=${CHANNEL_ID}")
          echo "conversations.info ok: $(echo "$resp" | jq -r '.ok')"
          echo "channel name: $(echo "$resp" | jq -r '.channel.name // "N/A"')"
          echo "error: $(echo "$resp" | jq -r '.error // "none"')"
        shell: bash

      - name: Format test alert
        id: fmt
        uses: ./.github/actions/collect-failure-info
        with:
          jobs_json: '[{"name": "Test", "run_id": "${{ github.run_id }}"}]'
          branch: ${{ github.ref_name }}
          server_url: ${{ github.server_url }}
          repository: ${{ github.repository }}
          actor: ${{ github.actor }}

  test-post:
    needs: [format-test]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test-posts'
    steps:
      - name: Post to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          ALERT_TEXT: ${{ needs.format-test.outputs.text }}
        run: |
          resp=$(jq -n --arg channel "$SLACK_CHANNEL_ID" --arg text "$ALERT_TEXT" \
            '{"channel": $channel, "text": $text}' | \
            curl -sS -X POST "https://slack.com/api/chat.postMessage" \
              -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
              -H "Content-Type: application/json" \
              -d @-)
          echo "$resp" | jq -e '.ok' > /dev/null || { echo "Slack API error: $resp"; exit 1; }
        shell: bash

      - name: Post to Discord
        env:
          DISCORD_CI_WEBHOOK_URL: ${{ secrets.DISCORD_CI_WEBHOOK_URL }}
          ALERT_TEXT: ${{ needs.format-test.outputs.text }}
        run: |
          jq -n --arg text "$ALERT_TEXT" '{"content": $text}' | \
            curl -sS -f -X POST "$DISCORD_CI_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d @-
        shell: bash

  post-call:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_call'
    steps:
      - name: Post to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          ALERT_TEXT: ${{ inputs.text }}
        run: |
          resp=$(jq -n --arg channel "$SLACK_CHANNEL_ID" --arg text "$ALERT_TEXT" \
            '{"channel": $channel, "text": $text}' | \
            curl -sS -X POST "https://slack.com/api/chat.postMessage" \
              -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
              -H "Content-Type: application/json" \
              -d @-)
          echo "$resp" | jq -e '.ok' > /dev/null || { echo "Slack API error: $resp"; exit 1; }
        shell: bash

      - name: Post to Discord
        env:
          DISCORD_CI_WEBHOOK_URL: ${{ secrets.DISCORD_CI_WEBHOOK_URL }}
          ALERT_TEXT: ${{ inputs.text }}
        run: |
          jq -n --arg text "$ALERT_TEXT" '{"content": $text}' | \
            curl -sS -f -X POST "$DISCORD_CI_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d @-
        shell: bash
