name: PR Conventional Commit Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
  workflow_call:
    outputs:
      run_id:
        description: "GitHub Actions run ID"
        value: ${{ jobs.validate-pr-title.outputs.run_id }}

permissions:
  pull-requests: read

concurrency:
  group: conventional-commit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.emit.outputs.run_id }}
    steps:
      - name: Emit run ID
        id: emit
        run: echo "run_id=${{ github.run_id }}" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: PR Conventional Commit Validation
        uses: ytanikin/pr-conventional-commits@b628c5a234cc32513014b7bfdd1e47b532124d98  # 1.3.0
        with:
          task_types: '["build","ci","chore","docs","feat","fix","perf","refactor","style","test"]'
          add_label: 'false'
