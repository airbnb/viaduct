name: Check Published Demo Apps

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch in viaduct-dev/* repos to test (NOT an airbnb/viaduct ref)"
        required: true
        type: string
      use_snapshot_repo:
        description: "Include the Maven Central snapshots repository during resolution (required for non-release branches that publish SNAPSHOT artifacts)"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      use_snapshot_repo:
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: check-demoapps-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        demoapp: [cli-starter, jetty-starter, ktor-starter, micronaut-starter, starwars]
    name: Test ${{ matrix.demoapp }}
    steps:
      - name: Clone standalone repo
        env:
          REF: ${{ inputs.ref }}
          DEMOAPP: ${{ matrix.demoapp }}
        run: |
          if ! git clone --branch "$REF" --depth 1 \
              "https://github.com/viaduct-dev/${DEMOAPP}.git" app; then
            echo "::error::Could not clone '${REF}' from viaduct-dev/${DEMOAPP} — the branch may not exist."
            echo "::error::Ephemeral tmp/* branches are cleaned up after a run; 'Re-run failed jobs' will not recreate them. Dispatch a fresh run instead."
            exit 1
          fi
        shell: bash

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: |
            17.0.21+1.2
            21.0.13+1.2

      - name: Use only patched toolchains
        shell: bash
        run: |
          gradle_opts="${GRADLE_OPTS:-}"
          gradle_opts+=" -Dorg.gradle.project.org.gradle.java.installations.auto-detect=false"
          gradle_opts+=" -Dorg.gradle.project.org.gradle.java.installations.auto-download=false"
          gradle_opts+=" -Dorg.gradle.project.org.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64"
          echo "GRADLE_OPTS=$gradle_opts" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v5

      - name: Test ${{ matrix.demoapp }}
        working-directory: app
        env:
          USE_VIADUCT_SNAPSHOT_REPO: ${{ inputs.use_snapshot_repo && 'true' || 'false' }}
        run: ./gradlew test --no-daemon
        shell: bash
