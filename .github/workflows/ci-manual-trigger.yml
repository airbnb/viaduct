name: CI (Manual Trigger)
# Runs the full CI suite — build-and-test, standalone demoapp tests, and API
# compatibility check — using each workflow's built-in defaults.
#
# This is a "run everything" convenience trigger, not a tool for targeting
# specific OS/Java combinations. To test a particular combination, trigger
# build-and-test.yml or standalone-demoapp-tests.yml directly and supply
# the os and java_versions inputs there.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      send_alerts:
        description: "Send Slack/Discord alerts on failure"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      send_alerts:
        description: "Send Slack/Discord alerts on failure"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  build-and-test:
    uses: ./.github/workflows/build-and-test.yml

  standalone-demoapp-tests:
    uses: ./.github/workflows/standalone-demoapp-tests.yml

  bcv-api-check:
    uses: ./.github/workflows/bcv-api-check.yml

  format-alerts:
    needs: [build-and-test, standalone-demoapp-tests, bcv-api-check]
    runs-on: ubuntu-latest
    if: >-
      always()
      && (needs.build-and-test.result == 'failure'
          || needs.standalone-demoapp-tests.result == 'failure'
          || needs.bcv-api-check.result == 'failure')
      && (github.event_name == 'push' || inputs.send_alerts == true)
    outputs:
      text: ${{ steps.fmt.outputs.text }}
    steps:
      - uses: actions/checkout@v6

      - name: Build failed jobs list
        id: jobs
        env:
          BAT_RESULT: ${{ needs.build-and-test.result }}
          BAT_RUN_ID: ${{ needs.build-and-test.outputs.run_id }}
          SDT_RESULT: ${{ needs.standalone-demoapp-tests.result }}
          SDT_RUN_ID: ${{ needs.standalone-demoapp-tests.outputs.run_id }}
          BCV_RESULT: ${{ needs.bcv-api-check.result }}
          BCV_RUN_ID: ${{ needs.bcv-api-check.outputs.run_id }}
        run: |
          jobs_json='[]'
          if [ "$BAT_RESULT" = "failure" ]; then
            jobs_json=$(echo "$jobs_json" | jq -c --arg name "Build and Test" --arg run_id "$BAT_RUN_ID" '. + [{"name": $name, "run_id": $run_id}]')
          fi
          if [ "$SDT_RESULT" = "failure" ]; then
            jobs_json=$(echo "$jobs_json" | jq -c --arg name "Demo App Tests" --arg run_id "$SDT_RUN_ID" '. + [{"name": $name, "run_id": $run_id}]')
          fi
          if [ "$BCV_RESULT" = "failure" ]; then
            jobs_json=$(echo "$jobs_json" | jq -c --arg name "API Compatibility" --arg run_id "$BCV_RUN_ID" '. + [{"name": $name, "run_id": $run_id}]')
          fi
          echo "jobs_json=$jobs_json" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Format alert
        id: fmt
        uses: ./.github/actions/collect-failure-info
        with:
          jobs_json: ${{ steps.jobs.outputs.jobs_json }}
          branch: ${{ github.ref_name }}
          server_url: ${{ github.server_url }}
          repository: ${{ github.repository }}
          sha: ${{ github.sha }}
          actor: ${{ github.actor }}

  send-alerts:
    needs: [format-alerts]
    if: always() && needs.format-alerts.result == 'success'
    uses: ./.github/workflows/post-alerts.yml
    with:
      text: ${{ needs.format-alerts.outputs.text }}
    secrets: inherit
