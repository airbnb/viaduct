name: Hourly Green Check

on:
  schedule:
    - cron: '0 14 * * *' # daily at 2pm UTC

  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to check (used by staleness check and as --ref for CI)"
        required: false
        default: main
        type: string
      mode:
        description: "Which check to run (schedule runs both)"
        required: false
        type: choice
        default: all
        options:
          - all
          - ci-check
          - staleness-check

permissions:
  contents: read
  actions: read

jobs:
  # ---------------------------------------------------------------------------
  # CI health check — run the full CI suite and alert on failure
  # ---------------------------------------------------------------------------
  ci-check:
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'all' || inputs.mode == 'ci-check'))
    uses: ./.github/workflows/ci-manual-trigger.yml

  notify-ci-failure:
    needs: [ci-check]
    runs-on: ubuntu-latest
    if: >-
      always()
      && needs.ci-check.result == 'failure'
    steps:
      - name: Collect failed job names
        id: failures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          failed_jobs=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" \
            --jq '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")')
          echo "failed_jobs=${failed_jobs}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Post CI failure to Slack
        uses: slackapi/slack-github-action@v3.0.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: ${{ vars.SLACK_CHANNEL_ID }}
            text: >-
              :red_circle: Scheduled CI check failed on `${{ inputs.branch || 'main' }}`
              (<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|view run>)

              Failed jobs: ${{ steps.failures.outputs.failed_jobs }}

  # ---------------------------------------------------------------------------
  # Staleness check — alert if main hasn't received commits recently
  # ---------------------------------------------------------------------------
  staleness-check:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'all' || inputs.mode == 'staleness-check'))
    steps:
      - name: Check for recent commits
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.branch || 'main' }}
        run: |
          # Skip Sunday (7) and Monday (1) on scheduled runs — no changes
          # expected from Saturday/Sunday. Manual runs always proceed.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            day_of_week=$(date -u +%u)
            if [ "$day_of_week" = "7" ] || [ "$day_of_week" = "1" ]; then
              echo "Skipping staleness check — no changes expected from the weekend"
              echo "stale=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          since=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          commit_count=$(gh api "repos/${{ github.repository }}/commits?sha=${BRANCH}&since=${since}&per_page=1" --jq 'length')

          if [ "$commit_count" -eq 0 ]; then
            echo "No commits on ${BRANCH} in the last 24 hours"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "Found recent commits on ${BRANCH}"
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Post staleness alert to Slack
        if: steps.check.outputs.stale == 'true'
        uses: slackapi/slack-github-action@v3.0.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: ${{ vars.SLACK_CHANNEL_ID }}
            text: >-
              :warning: No commits on `${{ inputs.branch || 'main' }}` in the last 24 hours
              — the sync from Airbnb may have stopped.
