name: Rehearse Release
# Rehearses a release under a throwaway version: uploads everything to Maven Central without publishing it,
# waits for Central to validate it and drops it, then asks the Plugin Portal to validate the Gradle plugins.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "main, or a release/vX.Y.Z branch before its final release"
        required: true
        default: main
        type: string
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
    secrets:
      VIADUCT_GRADLE_PUBLISH_KEY:
        required: true
      VIADUCT_GRADLE_PUBLISH_SECRET:
        required: true
      GPG_PRIVATE_KEY:
        required: true
      GPG_PASSPHRASE:
        required: true
      VIADUCT_SONATYPE_USERNAME:
        required: true
      VIADUCT_SONATYPE_PASSWORD:
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  rehearse:
    name: "Rehearse the release: Maven Central and Plugin Portal"
    runs-on: ubuntu-latest
    environment: release
    env:
      VIADUCT_DEPENDENCY_MIRROR_ROLE_ARN: ${{ vars.VIADUCT_DEPENDENCY_MIRROR_ROLE_ARN }}
      RELEASE: "true"
      CENTRAL_REHEARSAL: "true"
    steps:
      # The release environment's branch rules check the branch the workflow was dispatched on, not this input.
      - name: Allow only main or a release branch
        if: inputs.ref == ''
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          [[ "$BRANCH" =~ ^(main|release/v[0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "::error::rehearse main or a release/vX.Y.Z branch, not '${BRANCH}'"; exit 1; }
        shell: bash

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || format('refs/heads/{0}', inputs.branch) }}

      # The verifier and key come from the dispatched workflow, not from the rehearsed ref, which may predate them.
      - uses: actions/checkout@v6
        with:
          path: tooling

      - uses: ./.github/actions/setup-build
        with:
          java-version: '21'

      - name: Read the release version
        id: release
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
        shell: bash

      # A final version cannot be published twice; publish-branch.yml checks an RC's snapshot version itself.
      - name: "Maven Central and Plugin Portal: check the final version is not published yet"
        if: ${{ !endsWith(steps.release.outputs.version, '-SNAPSHOT') }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          ./gradlew writePublishedCoordinates --no-daemon --stacktrace
          python3 tooling/.github/scripts/probe_published_artifacts.py --root . --version "$VERSION" --require-unpublished
        shell: bash

      # Central does not document whether a dropped version can be uploaded again, and plugin-publish rejects -SNAPSHOT.
      - name: Set the rehearsal version
        id: version
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION%-SNAPSHOT}-rehearsal.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' "$version" > VERSION
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ./gradlew writePublishedCoordinates --no-daemon --stacktrace
        shell: bash

      - name: "Maven Central: build and sign every library and plugin into a local folder"
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: ./gradlew publishToMavenLocal -Dmaven.repo.local="${RUNNER_TEMP}/rehearsal-repository" --no-daemon --stacktrace
        shell: bash

      - name: "Maven Central: check every file's signature against the release key"
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 tooling/.github/scripts/verify_published_signatures.py \
            --root . --version "$VERSION" --local-repo "${RUNNER_TEMP}/rehearsal-repository" \
            --key tooling/.github/release-signing-key.asc
        shell: bash

      # gradle-maven-publish-plugin makes every Central upload depend on this task when automaticRelease is true;
      # the control run without CENTRAL_REHEARSAL proves the task still has that name.
      - name: "Maven Central: refuse to upload if any upload would publish"
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.VIADUCT_SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.VIADUCT_SONATYPE_PASSWORD }}
        run: |
          set -euo pipefail
          control="$(CENTRAL_REHEARSAL=false ./gradlew publishToMavenCentral --dry-run --no-daemon)"
          if ! grep -q 'enableAutomaticMavenCentralPublishing SKIPPED$' <<< "$control"; then
            echo "::error::without CENTRAL_REHEARSAL the dry run lists no enableAutomaticMavenCentralPublishing task," \
              "so this guard can no longer tell an upload from a publish"
            exit 1
          fi
          ./gradlew publishToMavenCentral --dry-run --no-daemon | tee "${RUNNER_TEMP}/central-plan.log"
          plan="$(cat "${RUNNER_TEMP}/central-plan.log")"
          uploads="$(grep -c 'ToMavenCentralRepository SKIPPED$' <<< "$plan" || true)"
          [ "$uploads" -gt 0 ] || { echo "::error::the publishToMavenCentral dry run lists no Maven Central upload"; exit 1; }
          if grep 'enableAutomaticMavenCentralPublishing SKIPPED$' <<< "$plan"; then
            echo "::error::these projects would publish to Maven Central instead of only uploading"
            exit 1
          fi
          echo "✅ ${uploads} Maven Central uploads, none set to publish"
        shell: bash

      - name: "Maven Central: upload every library and plugin without publishing"
        id: upload
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.VIADUCT_SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.VIADUCT_SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          ./gradlew publishToMavenCentral --no-daemon --stacktrace 2>&1 | tee "${RUNNER_TEMP}/central-upload.log"
        shell: bash

      - name: "Maven Central: wait for Central to validate every upload"
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.VIADUCT_SONATYPE_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.VIADUCT_SONATYPE_PASSWORD }}
        run: python3 tooling/.github/scripts/central_deployments.py wait --log "${RUNNER_TEMP}/central-upload.log"
        shell: bash

      - name: "Maven Central: drop every upload"
        if: always() && steps.upload.outcome != 'skipped'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.VIADUCT_SONATYPE_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.VIADUCT_SONATYPE_PASSWORD }}
        run: python3 tooling/.github/scripts/central_deployments.py drop --log "${RUNNER_TEMP}/central-upload.log"
        shell: bash

      - name: "Plugin Portal: validate every plugin without uploading"
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE }}
          GRADLE_PUBLISH_KEY: ${{ secrets.VIADUCT_GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.VIADUCT_GRADLE_PUBLISH_SECRET }}
        run: |
          set -euo pipefail
          # The aggregate gradle-plugins:publishPlugins does not pass --validate-only on, so each task it runs gets it.
          portal_tasks="$(./gradlew gradle-plugins:publishPlugins --dry-run --no-daemon | sed -n 's/^\(:gradle-plugins:[^ ]*:publishPlugins\) SKIPPED$/\1/p')"
          [ -n "$portal_tasks" ] || { echo "::error::the publishPlugins dry run listed no plugin tasks"; exit 1; }
          arguments=()
          for task in $portal_tasks; do arguments+=("$task" --validate-only); done
          LOG="${RUNNER_TEMP}/validate-plugins.log"
          ./gradlew "${arguments[@]}" --info --no-daemon --stacktrace 2>&1 | tee "$LOG"
          portal_plugin_ids="$(find . -path '*/build/reports/publication/coordinates.txt' -exec sed -n 's/^portal \([^:]*\):.*/\1/p' {} + | sort -u)"
          [ -n "$portal_plugin_ids" ] || { echo "::error::no Plugin Portal coordinates were derived"; exit 1; }
          missing=0
          # plugin-publish 2.0.0 logs this line at --info for each plugin it validates.
          for plugin in $portal_plugin_ids; do
            if ! grep -qxF "Validating plugin publication of ${plugin} version ${VERSION}" "$LOG"; then
              echo "::error::no publishPlugins task requested Plugin Portal validation of ${plugin} ${VERSION}"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "✅ the Plugin Portal validated $(echo "$portal_plugin_ids" | wc -l | tr -d ' ') plugins at ${VERSION}"
        shell: bash
