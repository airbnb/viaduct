name: Post Slack Alerts

on:
  workflow_run:
    workflows: ["Build and Test (Gradle)", "Standalone Demo App Tests"]
    branches: [main]
    types: [completed]

  workflow_dispatch:
    inputs:
      mode:
        description: "test-slack verifies connectivity; push-failure-alert tests the full alert using a run_id"
        required: true
        type: choice
        options:
          - test-slack
          - push-failure-alert
      run_id:
        description: "Workflow run ID to report on (required for push-failure-alert mode)"
        required: false
        type: string

concurrency:
  group: post-slack-alerts-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  post-alert:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'failure'
        && github.event.workflow_run.event == 'push')
      || (github.event_name == 'workflow_dispatch'
        && inputs.mode == 'push-failure-alert')
    steps:
      - name: Resolve run metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            run_id="${{ github.event.workflow_run.id }}"
            run_name="${{ github.event.workflow_run.name }}"
            run_url="${{ github.event.workflow_run.html_url }}"
            sha="${{ github.event.workflow_run.head_sha }}"
            actor="${{ github.event.workflow_run.actor.login }}"
            branch="${{ github.event.workflow_run.head_branch }}"
          else
            run_id="${{ inputs.run_id }}"
            if [ -z "$run_id" ]; then
              echo "::error::run_id is required for push-failure-alert mode"
              exit 1
            fi
            run_json=$(gh api "repos/${{ github.repository }}/actions/runs/${run_id}")
            run_name=$(echo "$run_json" | jq -r '.name')
            run_url=$(echo "$run_json" | jq -r '.html_url')
            sha=$(echo "$run_json" | jq -r '.head_sha')
            actor=$(echo "$run_json" | jq -r '.actor.login')
            branch=$(echo "$run_json" | jq -r '.head_branch')
          fi
          {
            echo "run_id=${run_id}"
            echo "run_name=${run_name}"
            echo "run_url=${run_url}"
            echo "sha=${sha}"
            echo "actor=${actor}"
            echo "branch=${branch}"
          } >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Collect failed job names
        id: failures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          failed_jobs=$(gh api "repos/${{ github.repository }}/actions/runs/${{ steps.meta.outputs.run_id }}/jobs?per_page=100" \
            --jq '[.jobs[] | select(.conclusion == "failure") | .name]
                  | group_by(split("(")[0] | rtrimstr(" "))
                  | map(.[0])
                  | join(", ")')
          echo "failed_jobs=${failed_jobs}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Post to Slack
        uses: slackapi/slack-github-action@v3.0.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: ${{ vars.SLACK_CHANNEL_ID }}
            text: >-
              :red_circle: *${{ steps.meta.outputs.run_name }}* failed on `${{ steps.meta.outputs.branch }}`
              (<${{ steps.meta.outputs.run_url }}|view run>)
              — commit `${{ steps.meta.outputs.sha }}` by ${{ steps.meta.outputs.actor }}

              Failed jobs: ${{ steps.failures.outputs.failed_jobs }}

  test-slack:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test-slack'
    steps:
      - name: Diagnose Slack channel
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
        run: |
          echo "Channel ID: '${CHANNEL_ID}'"
          echo "Token length: ${#SLACK_BOT_TOKEN}"
          resp=$(curl -s -X GET \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            "https://slack.com/api/conversations.info?channel=${CHANNEL_ID}")
          echo "conversations.info ok: $(echo "$resp" | jq -r '.ok')"
          echo "channel name: $(echo "$resp" | jq -r '.channel.name // "N/A"')"
          echo "error: $(echo "$resp" | jq -r '.error // "none"')"
        shell: bash

      - name: Post test message to Slack
        uses: slackapi/slack-github-action@v3.0.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: ${{ vars.SLACK_CHANNEL_ID }}
            text: >-
              :test_tube: Test message from Post Slack Alerts workflow
              (triggered by ${{ github.actor }} on branch `${{ github.ref_name }}`)
