name: Report Test Results
description: Lists tests that passed only after a retry in the job summary, then uploads the JUnit XML

inputs:
  artifact-name:
    description: 'Name of the uploaded JUnit XML artifact'
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      if: always()
      continue-on-error: true
      with:
        python-version: '3.x'

    - name: Install report dependencies
      if: always()
      continue-on-error: true
      shell: bash
      run: python -m pip install defusedxml

    - name: Report tests that passed after a retry
      if: always()
      shell: bash
      env:
        PYTHONUTF8: "1"
        GH_TOKEN: ${{ github.token }}
      run: |
        started_at=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" --jq .run_started_at) || {
          echo "::warning::Could not read the run start time, so results restored from the build cache are not skipped"
          started_at=""
        }
        python .github/scripts/report_retried_tests.py . "$started_at" >> "$GITHUB_STEP_SUMMARY" || {
          echo "::warning::Could not report the tests that passed after a retry"
        }

    - name: Upload JUnit test results
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.artifact-name }}
        path: '**/build/test-results/**/*.xml'
