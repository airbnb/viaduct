name: Collect Failure Info
description: Formats CI failure metadata into an alert message and a run-page summary using format_alert.py

inputs:
  jobs_json:
    description: 'JSON array of failed jobs, each with "name" and "run_id" and optional "job_id", "tasks" and "cause"'
    required: true
  branch:
    description: 'Branch name'
    required: true
  server_url:
    description: 'GitHub server URL'
    required: true
  repository:
    description: 'Full repository name (owner/repo)'
    required: true
  sha:
    description: 'Commit SHA (optional)'
    required: false
    default: ''
  actor:
    description: 'GitHub actor (optional)'
    required: false
    default: ''
  attempt:
    description: 'Run attempt number (optional); labeled in the alert only when above 1'
    required: false
    default: ''
  outcome:
    description: '"failure" (default), "retry_success" for a run a retry recovered, or "retrying"'
    required: false
    default: ''

outputs:
  text:
    description: 'Formatted alert text'
    value: ${{ steps.fmt.outputs.text }}
  summary:
    description: 'Markdown table of the failed jobs, for $GITHUB_STEP_SUMMARY'
    value: ${{ steps.fmt.outputs.summary }}

runs:
  using: composite
  steps:
    - name: Format alert
      id: fmt
      shell: bash
      env:
        JOBS_JSON: ${{ inputs.jobs_json }}
        BRANCH: ${{ inputs.branch }}
        SERVER_URL: ${{ inputs.server_url }}
        REPOSITORY: ${{ inputs.repository }}
        SHA: ${{ inputs.sha }}
        ACTOR: ${{ inputs.actor }}
        ATTEMPT: ${{ inputs.attempt }}
        OUTCOME: ${{ inputs.outcome }}
      run: |
        # Build the full payload — format_alert.py handles empty sha/actor
        # gracefully via .get() + truthiness checks.
        payload=$(jq -n \
          --arg branch "$BRANCH" \
          --arg server_url "$SERVER_URL" \
          --arg repository "$REPOSITORY" \
          --arg sha "$SHA" \
          --arg actor "$ACTOR" \
          --arg attempt "$ATTEMPT" \
          --arg outcome "$OUTCOME" \
          --argjson jobs "$JOBS_JSON" \
          '{ branch: $branch, server_url: $server_url, repository: $repository,
             jobs: $jobs }
           + (if $sha  != "" then { sha: $sha }   else {} end)
           + (if $actor != "" then { actor: $actor } else {} end)
           + (if $attempt != "" then { attempt: $attempt } else {} end)
           + (if $outcome != "" then { outcome: $outcome } else {} end)')
        text=$(printf '%s' "$payload" | python3 .github/scripts/format_alert.py)
        summary=$(printf '%s' "$payload" | python3 .github/scripts/format_alert.py --summary)

        {
          echo "text<<ALERT_EOF"
          echo "$text"
          echo "ALERT_EOF"
          echo "summary<<SUMMARY_EOF"
          echo "$summary"
          echo "SUMMARY_EOF"
        } >> "$GITHUB_OUTPUT"
