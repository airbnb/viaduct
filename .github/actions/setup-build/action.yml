name: Setup Build
description: Common setup steps for Java and Gradle

inputs:
  java-version:
    description: 'Java version to use'
    required: false
    default: '21'
  cache-read-only:
    description: 'Whether to use read-only Gradle cache mode'
    required: false
    default: 'false'
  cache-demoapp-distributions:
    description: >-
      Cache the Gradle distributions the demo app wrappers use. The root build pins a
      different Gradle version, so demo app jobs otherwise fetch theirs on every run.
    required: false
    default: 'false'
  cap-kotlin-daemon-heap:
    description: >-
      Cap the Kotlin daemon heap for every build that uses this job's Gradle user home.
      Demo app test jobs turn this off so their builds keep consumer defaults.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Resolve patched JDK
      id: jdk
      shell: bash
      env:
        REQUESTED_JAVA: ${{ inputs.java-version }}
      run: |
        # setup-java represents OpenJDK 21.0.13.1+2 as SemVer 21.0.13+1.2.
        case "$REQUESTED_JAVA" in
          17) version=17.0.21+1.2 ;;
          21) version=21.0.13+1.2 ;;
          25) version=25.0.5+1.2 ;;
          *) echo "::error::Unsupported Java version: $REQUESTED_JAVA"; exit 1 ;;
        esac
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Setup patched compiler and requested JDK
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        # Every job needs compiler JDK 17 and daemon JDK 21. The last entry
        # becomes JAVA_HOME; Gradle discovers all installed versions via fromEnv.
        java-version: |
          17.0.21+1.2
          21.0.13+1.2
          ${{ steps.jdk.outputs.version }}

    - name: Exclude preinstalled unpatched toolchains
      shell: bash
      run: |
        jdk_envs=JAVA_HOME_17_X64,JAVA_HOME_17_ARM64
        jdk_envs+=,JAVA_HOME_21_X64,JAVA_HOME_21_ARM64
        jdk_envs+=,JAVA_HOME_25_X64,JAVA_HOME_25_ARM64
        # Apply to standalone demo-app builds as well as the composite builds.
        gradle_opts="${GRADLE_OPTS:-}"
        # As -D flags, project toolchains read only the org.gradle.project. form and daemon JVM selection only the bare form.
        for prefix in org.gradle.project.org.gradle.java.installations org.gradle.java.installations; do
          gradle_opts+=" -D$prefix.auto-detect=false"
          gradle_opts+=" -D$prefix.auto-download=false"
          gradle_opts+=" -D$prefix.fromEnv=$jdk_envs"
        done
        echo "GRADLE_OPTS=$gradle_opts" >> "$GITHUB_ENV"

    - name: Configure dependency mirror
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/../../scripts/configure-dependency-mirror.sh"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c  # v5
      with:
        cache-read-only: ${{ inputs.cache-read-only }}

    - name: Cap the Kotlin daemon heap
      if: inputs.cap-kotlin-daemon-heap == 'true'
      shell: bash
      run: |
        # kotlin.daemon.jvmargs sets no -Xmx, so the Kotlin daemon would otherwise inherit org.gradle.jvmargs' -Xmx8g.
        jvmargs="$(sed -n 's/^kotlin\.daemon\.jvmargs=//p' gradle.properties)"
        if [ -z "$jvmargs" ]; then
          echo "::error::kotlin.daemon.jvmargs not found in gradle.properties"
          exit 1
        fi
        user_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
        mkdir -p "$user_home"
        echo "kotlin.daemon.jvmargs=$jvmargs -Xmx3g" >> "$user_home/gradle.properties"

    # Distributions pinned by the demo app wrappers, keyed on those wrapper properties so
    # a version bump invalidates the entry. The key is deliberately not OS-scoped: a
    # distribution unpacks to a URL-derived path that is identical on every platform and
    # holds only JARs and scripts, so one entry serves every runner. setup-gradle only
    # offers a job the distributions recorded against its own OS, so without this the
    # runners that never populate it fetch theirs from services.gradle.org each run.
    - name: Cache demo app Gradle distributions
      if: inputs.cache-demoapp-distributions == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.gradle/wrapper/dists
        key: gradle-demoapp-dists-v1-${{ hashFiles('demoapps/*/gradle/wrapper/gradle-wrapper.properties') }}
