# This ruleset is designed for use with the Viaduct BCV project to enforce specific coding standards.
# These rules are enabled by the packages that uses the bcv-api plugin.
viaduct-detekt-rules:
  ApiStabilityAnnotationRequired:
    active: true
    # BuildFlags.kt is a copy kept byte-identical with build-logic/common (enforced by
    # checkSharedFileSync in the root build.gradle.kts). build-logic has no access to
    # viaduct.apiannotations, so the shared source cannot carry a stability annotation; exempt it.
    excludes: ['**/viaduct/gradle/shared/BuildFlags.kt']
